[env:lolin_s3_mini]
; Version ranges pin the major version of every dependency so a future build
; cannot silently pull in a breaking release. This matters most for ArduinoJson:
; the firmware uses the v7 API (JsonDocument, arr.add<JsonObject>()), which does
; not compile against v6.
;
; These are major-version floors, not exact pins. After the first successful
; build run `pio pkg list` and replace each range with the exact version it
; resolved, so the build is reproducible rather than merely non-breaking.
platform = espressif32@^6.5.0
; The hardware is an ESP32-S3 SuperMini, which has no PlatformIO board
; definition. lolin_s3_mini is a deliberate close-enough substitute — same
; ESP32-S3 target, and every pin the firmware uses is defined explicitly in
; main.cpp rather than inherited from the board definition.
board = lolin_s3_mini
framework = arduino

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit GFX Library@^1.11.0
    crankyoldgit/IRremoteESP8266@^2.8.0
    bblanchon/ArduinoJson@^7.0.0

; The lolin_s3_mini board definition hardcodes ARDUINO_USB_MODE=1 (CDC serial).
; Removing it here rather than just appending our own avoids defining the macro
; twice: the build then relied on -D ordering (last one wins) and emitted ~170
; "ARDUINO_USB_MODE redefined" warnings that drowned out any real ones. If that
; ordering ever changed, the device would silently enumerate as CDC serial
; instead of HID and the daemon would never find it.
build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    ; ARDUINO_USB_MODE=0 enables TinyUSB, required for custom HID devices.
    ; Phase 1 used MODE=1 (CDC Serial) — Phase 2 uses MODE=0 (HID).
    -D ARDUINO_USB_MODE=0

; Use LittleFS for the filesystem partition.
; 'pio run -t uploadfs' uploads the data/ directory to this partition.
; The firmware itself creates profiles.json and settings.json on first boot.
board_build.filesystem = littlefs
