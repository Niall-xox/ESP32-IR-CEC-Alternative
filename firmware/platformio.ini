[env:lolin_s3_mini]
; Exact versions, not floors. A caret range only promises the build will not
; break; it does not promise two people building the same commit get the same
; binary. These are the versions the firmware was built and hardware-verified
; against — bump them deliberately, then re-verify.
;
; The pin matters most for ArduinoJson: the firmware uses the v7 API
; (JsonDocument, arr.add<JsonObject>()), which does not compile against v6.
platform = espressif32@6.13.0
; The hardware is an ESP32-S3 SuperMini, which has no PlatformIO board
; definition. lolin_s3_mini is a deliberate close-enough substitute — same
; ESP32-S3 target, and every pin the firmware uses is defined explicitly in
; main.cpp rather than inherited from the board definition.
board = lolin_s3_mini
framework = arduino

lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    crankyoldgit/IRremoteESP8266@2.9.0
    bblanchon/ArduinoJson@7.4.3

; The lolin_s3_mini board definition hardcodes ARDUINO_USB_MODE=1 (CDC serial).
; Removing it here rather than just appending our own avoids defining the macro
; twice: the build then relied on -D ordering (last one wins) and emitted ~170
; "ARDUINO_USB_MODE redefined" warnings that drowned out any real ones. If that
; ordering ever changed, the device would silently enumerate as CDC serial
; instead of HID and the daemon would never find it.
build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    ; ARDUINO_USB_MODE=0 enables TinyUSB, required for custom HID devices.
    ; Phase 1 used MODE=1 (CDC Serial) — Phase 2 uses MODE=0 (HID).
    -D ARDUINO_USB_MODE=0

; Use LittleFS for the filesystem partition.
; 'pio run -t uploadfs' uploads the data/ directory to this partition.
; The firmware itself creates profiles.json and settings.json on first boot.
board_build.filesystem = littlefs

; Pin the flash layout explicitly.
;
; This is the table the board definition already selects by default, so naming
; it changes nothing about the current build — that is the point. Left implicit,
; the layout is whatever the pinned platform happens to default to, and a
; platform bump that moved the filesystem offset would silently relocate
; LittleFS out from under a device that already has profiles stored in it.
; Saved profiles are user data; where they live is not something to inherit.
board_build.partitions = default.csv
